name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "node"

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Run smoke test
        run: npm run smoke

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: snip2me-dist
          path: |
            dist/s2m.js
            dist/s2m.min.js
